<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim ve Başvuru</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-mortarboard-fill text-warning"></i> KampüsNet</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Ana Sayfa</a></li>
                    <li class="nav-item"><a class="nav-link" href="clubs.html">Kulüpler</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">İletişim</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">Ana Sayfa</a></li>
                <li class="breadcrumb-item active">İletişim ve Başvuru</li>
            </ol>
        </nav>

        <div class="row">
            <!-- Form Alanı -->
            <div class="col-lg-7 mb-4">
                <div class="card shadow-sm border-0 p-4">
                    <h3 class="mb-3">Kulüp Üyelik Başvuru Formu</h3>
                    <form>
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="ad" placeholder="Ad" required>
                            <label for="ad">Adınız Soyadınız</label>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">E-posta</label>
                            <input type="email" class="form-control" placeholder="ornek@ogrenci.edu.tr" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Kulüp Seçimi</label>
                            <select class="form-select">
                                <option selected>Seçiniz...</option>
                                <option>Yazılım ve Teknoloji Kulübü</option>
                                <option>Dijital Pazarlama Kulübü</option>
                                <option>Robotik ve İnovasyon Kulübü</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Neden Bu Kulüp?</label>
                            <textarea class="form-control" rows="3"></textarea>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" required>
                            <label class="form-check-label">KVKK koşullarını kabul ediyorum.</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Başvuruyu Gönder</button>
                    </form>
                </div>
            </div>

            <!-- SSS ve Bilgi -->
            <div class="col-lg-5">
                <div class="card shadow-sm border-0 p-3 mb-4">
                    <h4>Sık Sorulan Sorular</h4>
                    <div class="accordion mt-3" id="sss">
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                                <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#c1">Birden fazla kulübe üye olabilir miyim?</button>
                            </h2>
                            <div id="c1" class="accordion-collapse collapse show" data-bs-parent="#sss">
                                <div class="accordion-body">Evet, birden fazla kulübe üye olabilirsiniz.</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="alert alert-info">
                    <i class="bi bi-info-circle-fill"></i> Sorularınız için <strong>kulupler@kampus.edu.tr</strong> yazabilirsiniz.
                </div>
            </div>
        </div>
    </div>

    <footer class="py-4 bg-dark text-white text-center mt-5">
        <div class="container"><p class="mb-0">&copy; 2026 KampüsNet <span class="badge bg-secondary">v1.0</span></p></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
